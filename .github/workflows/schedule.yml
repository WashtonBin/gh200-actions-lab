name: Scheduled

on:
  schedule:
   - cron: "*/5 * * * *" # every 5 minutes (UTC)
   - cron: "55 22 * * 1-5" # 09:30, Monday to Friday
     timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC time now: $(date -u)"